name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST に再ビルドして GitHub 活動を更新
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cloudflare Web Analytics のサイト token（HTML に載る公開値なので Variables で管理）
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          # Cloudflare Turnstile のサイトキー（公開値）。未設定ならテスト用キーになり、本番ではフォーム送信が失敗する
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: bash scripts/security-scan.sh
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # デプロイ後の確認: 問い合わせフォームの設定（Worker の Secrets）が残っているか
      # トークンなしで送ると、設定が揃っていれば Turnstile の検証で拒否（error=captcha）、欠けていれば error=unavailable になる
      - name: Smoke test (contact form config)
        run: |
          url="https://de.daisuke-harato.workers.dev"
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST "$url/api/contact" -H "Origin: $url" -d 'subject=smoke&email=smoke@example.com&message=smoke')
          echo "redirect: $loc"
          case "$loc" in
            *error=captcha*) echo "contact form config OK" ;;
            *) echo "::error::問い合わせフォームの Secrets が欠けています（TURNSTILE_SECRET_KEY / CONTACT_GAS_URL / CONTACT_GAS_SECRET を「シークレット」として設定してください）"; exit 1 ;;
          esac

