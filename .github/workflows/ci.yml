name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  # Weekly Tech Report の自動 PR 用（GITHUB_TOKEN で作った PR では pull_request が発火しないため）
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Preview URL をコメントする PR 番号"
        required: true

permissions:
  contents: read

jobs:
  build-and-scan:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/security-scan.sh

  # PR ごとに Cloudflare Workers Preview（pr-<番号>-de.<subdomain>.workers.dev）を作成・更新する。本番には影響しない
  preview:
    needs: build-and-scan
    # fork からの PR には Secrets が渡らないため同一リポジトリのみ
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "invalid PR number"; exit 1; }
          npx wrangler preview --name "pr-$PR_NUMBER" --message "PR #$PR_NUMBER $HEAD_SHA" --json > preview.json || { cat preview.json; exit 1; }
          # wrangler は JSON の前にアセットのアップロード状況を出力するため、先頭の "{" 以降だけを読む
          url=$(sed -n '/^{/,$p' preview.json | jq -er '.preview.urls[0]') || { cat preview.json; exit 1; }
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "🔍 **Preview**: [$URL]($URL) (commit ${HEAD_SHA:0:7})" --edit-last --create-if-none

  # PR を閉じたらプレビューを削除する
  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation
